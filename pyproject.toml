[project]
name = "seerrcompanion"
version = "0.1.0"
description = "Companion for Seerr: trims multi-season TV requests and flags unwatched requests for deletion"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "apprise>=1.8", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seerrcompanion = "seerrcompanion.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seerrcompanion = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
